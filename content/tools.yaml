- id: "tool-001"
  name: "K9s"
  tagline: "Kubernetes CLI Terminal UI"
  category: "terminal-ui"
  description: "Terminal-based UI to navigate, observe, and manage Kubernetes clusters."
  why: "Accelerates cluster navigation, real-time log viewing, shell exec, and resource inspection with keyboard shortcuts."
  installation:
    macos: "brew install derailed/k9s/k9s"
    linux: "curl -sS https://webinstall.dev/k9s | bash"
  verification_command: "k9s version"
  first_useful_command: "k9s --context dev-cluster -n default"
  maintenance_status: "actively-maintained"
  official_docs: "https://k9scli.io/"
  repository: "https://github.com/derailed/k9s"

- id: "tool-002"
  name: "kubectx"
  tagline: "Fast Kubernetes Context Switcher"
  category: "context-mgmt"
  description: "Lightweight tool to switch between Kubernetes contexts seamlessly."
  why: "Eliminates typing verbose `kubectl config use-context` commands, preventing accidental execution against wrong clusters."
  installation:
    macos: "brew install kubectx"
    linux: "sudo git clone https://github.com/ahmetb/kubectx /opt/kubectx && sudo ln -s /opt/kubectx/kubectx /usr/local/bin/kubectx"
  verification_command: "kubectx --help"
  first_useful_command: "kubectx minikube"
  maintenance_status: "actively-maintained"
  official_docs: "https://github.com/ahmetb/kubectx"
  repository: "https://github.com/ahmetb/kubectx"

- id: "tool-003"
  name: "kubens"
  tagline: "Fast Kubernetes Namespace Switcher"
  category: "namespace-mgmt"
  description: "Tool to switch default namespace context effortlessly."
  why: "Removes requirement to pass `-n <namespace>` flag on every subsequent kubectl command."
  installation:
    macos: "brew install kubectx"
    linux: "sudo git clone https://github.com/ahmetb/kubectx /opt/kubectx && sudo ln -s /opt/kubectx/kubens /usr/local/bin/kubens"
  verification_command: "kubens --help"
  first_useful_command: "kubens kube-system"
  maintenance_status: "actively-maintained"
  official_docs: "https://github.com/ahmetb/kubectx"
  repository: "https://github.com/ahmetb/kubectx"

- id: "tool-004"
  name: "Krew"
  tagline: "kubectl Plugin Package Manager"
  category: "plugins"
  description: "Package manager for discovering, installing, and managing kubectl plugins."
  why: "Standardizes plugin installation and discovery across teams."
  installation:
    macos: "brew install krew"
    linux: "curl -fsSL https://github.com/kubernetes-sigs/krew/releases/latest/download/krew-linux_amd64.tar.gz | tar zx && ./krew-linux_amd64 install krew"
  verification_command: "kubectl krew version"
  first_useful_command: "kubectl krew search"
  maintenance_status: "actively-maintained"
  official_docs: "https://krew.sigs.k8s.io/"
  repository: "https://github.com/kubernetes-sigs/krew"

- id: "tool-005"
  name: "kubectl-neat"
  tagline: "Clean Redundant Boilerplate from K8s Manifests"
  category: "yaml-cleanup"
  description: "kubectl plugin to strip clutter, status, managedFields, and default values from exported YAML."
  why: "Produces clean, readable manifests for git commits or template creation."
  installation:
    macos: "kubectl krew install neat"
    linux: "kubectl krew install neat"
  verification_command: "kubectl neat --help"
  first_useful_command: "kubectl get deployment my-app -o yaml | kubectl neat"
  maintenance_status: "actively-maintained"
  official_docs: "https://github.com/itaysk/kubectl-neat"
  repository: "https://github.com/itaysk/kubectl-neat"

- id: "tool-006"
  name: "Stern"
  tagline: "Multi-Pod and Container Log Tailer"
  category: "debugging"
  description: "Allows tailing logs from multiple pods and containers simultaneously using regex pattern matching."
  why: "Eliminates tracking multiple pods individually when debugging microservices."
  installation:
    macos: "brew install stern"
    linux: "curl -fsSL https://github.com/stern/stern/releases/latest/download/stern_linux_amd64.tar.gz | tar zx && sudo mv stern /usr/local/bin/"
  verification_command: "stern --version"
  first_useful_command: "stern web-backend-.* -n default"
  maintenance_status: "actively-maintained"
  official_docs: "https://github.com/stern/stern"
  repository: "https://github.com/stern/stern"

- id: "tool-007"
  name: "Popeye"
  tagline: "Kubernetes Cluster Sanitizer & Linter"
  category: "rbac"
  description: "Scans live cluster resources and reports potential misconfigurations, dead resources, and security issues."
  why: "Identifies unused ConfigMaps, missing resource requests/limits, and unattached PVCs."
  installation:
    macos: "brew install derailed/popeye/popeye"
    linux: "curl -sS https://webinstall.dev/popeye | bash"
  verification_command: "popeye version"
  first_useful_command: "popeye --out standard"
  maintenance_status: "actively-maintained"
  official_docs: "https://popeyecli.io/"
  repository: "https://github.com/derailed/popeye"
