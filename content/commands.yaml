- id: "cmd-001"
  title: "Watch Pod Status Changes in Real Time"
  category: "productivity"
  difficulty: "beginner"
  command: "kubectl get pods -w"
  description: "Streams live state transitions, readiness updates, and restart counts for pods in the target namespace."
  why: "Eliminates repetitive polling or manual terminal refreshes during rollouts, updates, or pod restarts."
  example: "kubectl get pods -n default -w"
  breakdown:
    - flag: "-w / --watch"
      meaning: "Stream ongoing state modifications after outputting current resource listing."
    - flag: "-n / --namespace"
      meaning: "Specify target namespace (defaults to current namespace context if omitted)."
  safety: "safe"
  test_environment: "safe-read"
  official_docs: "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_get/"
  verified: true
  verification_notes: "Verified on local Kubernetes v1.30 environment."
  tags:
    - "kubectl"
    - "pods"
    - "monitoring"

- id: "cmd-002"
  title: "List Pods Across All Cluster Namespaces"
  category: "productivity"
  difficulty: "beginner"
  command: "kubectl get pods -A"
  description: "Lists all pods across all namespaces within the active cluster context."
  why: "Quickly locates pods across isolated team namespaces without repeatedly switching namespace contexts."
  example: "kubectl get pods -A -o wide"
  breakdown:
    - flag: "-A / --all-namespaces"
      meaning: "List requested resources across every namespace in the cluster."
    - flag: "-o wide"
      meaning: "Output additional details including Pod IP and assigned worker node name."
  safety: "safe"
  test_environment: "safe-read"
  official_docs: "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_get/"
  verified: true
  verification_notes: "Verified on local Kubernetes v1.30 environment."
  tags:
    - "kubectl"
    - "namespaces"
    - "discovery"

- id: "cmd-003"
  title: "Sort Cluster Events by Last Timestamp"
  category: "troubleshooting"
  difficulty: "beginner"
  command: "kubectl get events --sort-by=.lastTimestamp"
  description: "Displays cluster events ordered chronologically by their last timestamp."
  why: "Rapidly pinpoints recent warnings, failed scheduling, image pull errors, or pod crashes."
  example: "kubectl get events -n default --sort-by=.lastTimestamp"
  breakdown:
    - flag: "--sort-by"
      meaning: "Sort output using JSONPath expression matching event timestamp field."
  safety: "safe"
  test_environment: "safe-read"
  official_docs: "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_get/"
  verified: true
  verification_notes: "Verified on local Kubernetes v1.30 environment."
  tags:
    - "events"
    - "troubleshooting"
    - "sorting"

- id: "cmd-004"
  title: "Explore API Resource Schema Fields"
  category: "kubectl"
  difficulty: "intermediate"
  command: "kubectl explain deployment.spec.template.spec.containers"
  description: "Prints API field documentation and data types directly in the terminal."
  why: "Allows engineers to construct and edit manifests accurately without context-switching to browser documentation."
  example: "kubectl explain pod.spec.securityContext"
  breakdown:
    - flag: "explain"
      meaning: "Look up API documentation for specific resource schema path."
  safety: "safe"
  test_environment: "safe-read"
  official_docs: "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_explain/"
  verified: true
  verification_notes: "Verified on local Kubernetes v1.30 environment."
  tags:
    - "kubectl"
    - "schema"
    - "yaml"

- id: "cmd-005"
  title: "Generate Clean Manifest via Client Dry-Run"
  category: "yaml"
  difficulty: "intermediate"
  command: "kubectl create deployment demo-app --image=nginx:latest --dry-run=client -o yaml"
  description: "Generates valid resource YAML without submitting the object to the Kubernetes API server."
  why: "Fastest way to create boilerplates without hand-typing YAML indentation."
  example: "kubectl create deployment demo-app --image=nginx:latest --dry-run=client -o yaml > deployment.yaml"
  breakdown:
    - flag: "--dry-run=client"
      meaning: "Format and validate manifest locally without sending HTTP request to cluster."
    - flag: "-o yaml"
      meaning: "Print output in standard YAML format."
  safety: "safe"
  test_environment: "safe-read"
  official_docs: "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/"
  verified: true
  verification_notes: "Verified on local Kubernetes v1.30 environment."
  tags:
    - "yaml"
    - "dry-run"
    - "kubectl"

- id: "cmd-006"
  title: "Trigger Graceful Rolling Restart of Deployment"
  category: "workloads"
  difficulty: "intermediate"
  command: "kubectl rollout restart deployment/myapp"
  description: "Triggers a controlled rolling restart of all pods managed by a Deployment without service downtime."
  why: "Pick up updated ConfigMaps, Secrets, or clear transient process memory leaks safely."
  example: "kubectl rollout restart deployment/myapp -n production"
  breakdown:
    - flag: "rollout restart"
      meaning: "Update pod template annotation to trigger immediate rolling update sequence."
  safety: "caution"
  test_environment: "safe-local"
  official_docs: "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_rollout/"
  verified: true
  verification_notes: "Verified on local test cluster."
  tags:
    - "deployments"
    - "rollout"
    - "restart"

- id: "cmd-007"
  title: "Roll Back Deployment to Previous Revision"
  category: "workloads"
  difficulty: "intermediate"
  command: "kubectl rollout undo deployment/myapp"
  description: "Reverts a Deployment to its previous revision when a rollout experiences unexpected failures."
  why: "Rapid incident mitigation during broken software deployments."
  example: "kubectl rollout undo deployment/myapp --to-revision=2"
  breakdown:
    - flag: "rollout undo"
      meaning: "Roll back target deployment to previous state."
    - flag: "--to-revision"
      meaning: "Target specific revision index from rollout history."
  safety: "caution"
  test_environment: "safe-local"
  official_docs: "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_rollout/"
  verified: true
  verification_notes: "Verified on local test cluster."
  tags:
    - "deployments"
    - "rollback"
    - "rollout"

- id: "cmd-008"
  title: "Retrieve Previous Container Logs Before Crash"
  category: "troubleshooting"
  difficulty: "beginner"
  command: "kubectl logs <pod-name> --previous"
  description: "Fetches stdout/stderr logs from the container instance immediately preceding a crash or restart."
  why: "Essential for diagnosing CrashLoopBackOff root causes when current container logs are empty."
  example: "kubectl logs web-backend-7945d8b857-x492l -c app --previous"
  breakdown:
    - flag: "--previous / -p"
      meaning: "Print logs from previously terminated container instance."
  safety: "safe"
  test_environment: "safe-read"
  official_docs: "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/"
  verified: true
  verification_notes: "Verified on local Kubernetes v1.30 environment."
  tags:
    - "logs"
    - "crashloopbackoff"
    - "troubleshooting"

- id: "cmd-009"
  title: "Inspect Pod and Node Resource Utilization"
  category: "resource-utilization"
  difficulty: "beginner"
  command: "kubectl top pods --containers"
  description: "Displays real-time CPU (cores/milli-cores) and Memory (MiB/GiB) consumption per container."
  why: "Identifies resource hogs, evaluates request/limit accuracy, and pinpoints potential OOM candidates."
  example: "kubectl top pods -n default --containers"
  breakdown:
    - flag: "top pods"
      meaning: "Fetch live metrics from Metrics Server API."
    - flag: "--containers"
      meaning: "Break down metrics per individual container inside multi-container pods."
  safety: "safe"
  test_environment: "safe-read"
  official_docs: "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_top/"
  verified: true
  verification_notes: "Verified against cluster with Metrics Server installed."
  tags:
    - "metrics"
    - "top"
    - "cpu"
    - "memory"

- id: "cmd-010"
  title: "Forward Local Port to Kubernetes Service"
  category: "networking"
  difficulty: "intermediate"
  command: "kubectl port-forward svc/my-service 8080:80"
  description: "Establishes a secure local TCP tunnel from localhost port 8080 to service targetPort 80."
  why: "Allows private cluster service testing without exposing Public LoadBalancers or modifying Ingress."
  example: "kubectl port-forward svc/grafana 3000:3000 -n monitoring"
  breakdown:
    - flag: "port-forward"
      meaning: "Forward one or more local ports to pod/service ports."
  safety: "safe"
  test_environment: "safe-read"
  official_docs: "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_port-forward/"
  verified: true
  verification_notes: "Verified local TCP forwarding."
  tags:
    - "networking"
    - "port-forward"
    - "debugging"
