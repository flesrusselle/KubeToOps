name: Controlled Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_run:
    workflows:
      - PR Validation & Summary
      - Security & Secret Scanning
      - Documentation Link Check
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    name: Auto-Merge Automated PRs
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate and Merge Eligible Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          PR_NUMBER=$(jq -r '.pull_request.number // .workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request is associated with this event."
            exit 0
          fi

          PR_DATA=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" \
            --json author,headRefName,headRepositoryOwner,isDraft,state)
          PR_STATE=$(jq -r '.state' <<<"$PR_DATA")
          IS_DRAFT=$(jq -r '.isDraft' <<<"$PR_DATA")
          AUTHOR=$(jq -r '.author.login' <<<"$PR_DATA")
          HEAD_BRANCH=$(jq -r '.headRefName' <<<"$PR_DATA")
          HEAD_OWNER=$(jq -r '.headRepositoryOwner.login' <<<"$PR_DATA")

          if [ "$PR_STATE" != "OPEN" ] || [ "$IS_DRAFT" = "true" ] || [ "$HEAD_OWNER" != "$REPOSITORY_OWNER" ]; then
            echo "Pull request is not an eligible open branch from this repository."
            exit 0
          fi

          if [[ "$HEAD_BRANCH" == automation/command-of-the-day-* ]]; then
            PR_TYPE="cotd"
          elif [ "$AUTHOR" = "app/dependabot" ] || [ "$AUTHOR" = "dependabot" ]; then
            PR_TYPE="dependabot"
          else
            echo "Pull request is not from an approved automation."
            exit 0
          fi

          mapfile -t CHANGED_FILES < <(gh pr diff "$PR_NUMBER" --repo "$REPOSITORY" --name-only)
          if [ "${#CHANGED_FILES[@]}" -eq 0 ]; then
            echo "No changed files found; merge blocked."
            exit 1
          fi

          for FILE in "${CHANGED_FILES[@]}"; do
            if [ "$PR_TYPE" = "cotd" ]; then
              if [ "$FILE" != "command-of-the-day/README.md" ] && [ "$FILE" != "command-of-the-day/history.json" ]; then
                echo "Unexpected file in generated-content pull request: $FILE"
                exit 1
              fi
            elif [[ "$FILE" != .github/workflows/* && "$FILE" != "requirements.txt" && "$FILE" != "requirements-dev.txt" ]]; then
              echo "Unexpected file in dependency pull request: $FILE"
              exit 1
            fi
          done

          CHECKS=$(gh pr checks "$PR_NUMBER" --repo "$REPOSITORY" \
            --json name,state --jq '[.[] | select(.name != "Auto-Merge Automated PRs")]')
          if jq -e 'any(.state == "FAILURE" or .state == "CANCELLED" or .state == "TIMED_OUT" or .state == "ACTION_REQUIRED")' <<<"$CHECKS" >/dev/null; then
            echo "A pull request check failed; merge blocked."
            exit 1
          fi
          if jq -e 'any(.state == "PENDING" or .state == "QUEUED" or .state == "IN_PROGRESS")' <<<"$CHECKS" >/dev/null; then
            echo "Pull request checks are still running; a completion event will retry the merge."
            exit 0
          fi

          VALIDATION=$(jq -r '[.[] | select(.name == "Validate PR & Update Summary")][0].state // "MISSING"' <<<"$CHECKS")
          SECURITY=$(jq -r '[.[] | select(.name == "Gitleaks Secret Scan")][0].state // "MISSING"' <<<"$CHECKS")
          if [ "$VALIDATION" != "SUCCESS" ] || [ "$SECURITY" != "SUCCESS" ]; then
            echo "Required validation checks have not completed successfully."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --delete-branch
          echo "Merged eligible automated pull request #${PR_NUMBER}."
