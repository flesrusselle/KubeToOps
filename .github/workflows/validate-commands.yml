name: Command Catalog Validation

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  validate-catalog:
    name: Validate Catalog Schema & URLs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Catalog Validator
        run: python3 scripts/validate_commands.py content/commands.yaml content/tools.yaml

      - name: Run Python Unit Tests
        run: pytest tests/ -v
