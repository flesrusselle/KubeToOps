name: Documentation Link Check

on:
  push:
    branches: [main]
    paths:
      - '**.md'
  pull_request:
    branches: [main]
    paths:
      - '**.md'

permissions:
  contents: read

jobs:
  lychee:
    name: Lychee Link Checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheever/lychee-action@v1
        with:
          args: --verbose --no-progress '--exclude=localhost|127.0.0.1' '**/*.md'
          fail: false
