name: PR Validation & Summary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate PR & Update Summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Validate Command Catalog
        run: python3 scripts/validate_commands.py content/commands.yaml content/tools.yaml

      - name: Run Python Unit Tests
        run: pytest tests/

      - name: Generate Release Preview & Update PR Summary
        if: always()
        run: |
          python3 scripts/update_pr_summary.py --output-file pr_summary.md
          cat pr_summary.md

      - name: Post or Update PR Comment Summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryBody = fs.readFileSync('pr_summary.md', 'utf8');
            const marker = '<!-- KUBE2OPS_PR_SUMMARY -->';
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            
            const botComment = comments.find(c => c.body.includes(marker));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summaryBody
              });
              console.log('Updated existing PR summary comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: summaryBody
              });
              console.log('Created new PR summary comment.');
            }
