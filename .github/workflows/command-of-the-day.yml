name: Command of the Day Automation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      command_id:
        description: 'Optional Command ID to generate explicitly (e.g. cmd-001)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-cotd:
    name: Generate Command of the Day PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Command Catalog Before Generation
        run: python3 scripts/validate_commands.py content/commands.yaml content/tools.yaml

      - name: Run Command of the Day Generator
        run: |
          CMD_ID="${{ inputs.command_id }}"
          if [ -n "$CMD_ID" ]; then
            python3 scripts/generate_command_of_day.py --command-id "$CMD_ID"
          else
            python3 scripts/generate_command_of_day.py
          fi

      - name: Check for Changes
        id: git_check
        run: |
          if git diff --quiet command-of-the-day/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No updates detected for Command of the Day — stopping successfully."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in command-of-the-day/ — proceeding to PR creation."
          fi

      - name: Create Pull Request
        if: steps.git_check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update Kubernetes Command of the Day (${{ github.event.repository.updated_at }})"
          title: "docs: update Kubernetes Command of the Day"
          body: |
            Automated daily Kubernetes Command of the Day update.

            Changes:
              - command-of-the-day/README.md updated
              - command-of-the-day/history.json updated

            This PR was automatically generated by the Command of the Day workflow.
          branch: "automation/command-of-the-day-${{ github.run_id }}"
          base: main
          delete-branch: true
