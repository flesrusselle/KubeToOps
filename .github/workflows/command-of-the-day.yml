name: Command of the Day Automation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      command_id:
        description: 'Optional Command ID to generate explicitly (e.g. cmd-001)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-cotd:
    name: Generate Command of the Day PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Command Catalog Before Generation
        run: python3 scripts/validate_commands.py content/commands.yaml content/tools.yaml

      - name: Run Command of the Day Generator
        run: |
          CMD_ID="${{ inputs.command_id }}"
          if [ -n "$CMD_ID" ]; then
            python3 scripts/generate_command_of_day.py --command-id "$CMD_ID"
          else
            python3 scripts/generate_command_of_day.py
          fi

      - name: Check for Changes
        id: git_check
        run: |
          if git diff --quiet command-of-the-day/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No updates detected for Command of the Day — stopping successfully."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in command-of-the-day/ — proceeding to PR creation."
          fi

      - name: Create Pull Request
        if: steps.git_check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_STR=$(date +%Y-%m-%d)
          BRANCH_NAME="automation/command-of-the-day-${DATE_STR}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Delete remote branch if it already exists (idempotent re-run)
          git push origin --delete "$BRANCH_NAME" 2>/dev/null || true

          git checkout -b "$BRANCH_NAME"
          git add command-of-the-day/
          git commit -m "docs: update Kubernetes Command of the Day (${DATE_STR})"
          git push origin "$BRANCH_NAME"

          # Check if PR already exists for this branch
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$EXISTING_PR" ]; then
            echo "PR already exists: #${EXISTING_PR} — skipping PR creation."
          else
            PR_BODY_FILE=$(mktemp)
            printf 'Automated daily Kubernetes Command of the Day update for %s.\n\nChanges:\n  - command-of-the-day/README.md updated\n  - command-of-the-day/history.json updated\n\nValidation:\n  - Command catalog validated before generation\n  - Generated content verified\n\nThis PR was created automatically by the Command of the Day workflow.' "$DATE_STR" > "$PR_BODY_FILE"

            gh pr create \
              --title "docs: update Kubernetes Command of the Day (${DATE_STR})" \
              --body-file "$PR_BODY_FILE" \
              --base main \
              --head "$BRANCH_NAME" || \
            gh pr create \
              --title "docs: update Kubernetes Command of the Day (${DATE_STR})" \
              --body "Automated daily Kubernetes Command of the Day update for ${DATE_STR}." \
              --base main \
              --head "$BRANCH_NAME"

            rm -f "$PR_BODY_FILE"
          fi
